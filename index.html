<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal CBT Modern - Darul Fawaid Ilmiyah</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 10% 20%, rgb(15, 23, 42) 0%, rgb(30, 41, 59) 90%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      color: #fff;
    }
    .brand-icon {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
    }
    .form-control {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.95rem;
    }
    .form-control:focus {
      background: rgba(15, 23, 42, 0.9);
      border-color: #10b981;
      color: #fff;
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2);
    }
    .btn-login {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border: none;
      color: white;
      font-weight: 700;
      padding: 12px 20px;
      border-radius: 12px;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="brand-icon">
    <i class="fas fa-graduation-cap fa-2x text-white"></i>
  </div>
  <div class="text-center mb-4">
    <h3 class="fw-bold mb-1">CBT Portal Ujian</h3>
    <p class="text-secondary small mb-0">Darul Fawaid Ilmiyah</p>
  </div>

  <form onsubmit="prosesLogin(event)">
    <div class="mb-3">
      <label class="form-label text-light small fw-semibold">Username / NIS / NIP</label>
      <div class="input-group">
        <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fas fa-user"></i></span>
        <input type="text" id="username" class="form-control" placeholder="Masukkan username..." required autofocus>
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label text-light small fw-semibold">Password</label>
      <div class="input-group">
        <span class="input-group-text bg-dark border-secondary text-secondary"><i class="fas fa-lock"></i></span>
        <input type="password" id="password" class="form-control" placeholder="Masukkan password..." required>
      </div>
    </div>

    <div id="msg" class="text-danger small mb-3 text-center"></div>

    <button type="submit" id="btnLogin" class="btn btn-login w-100 mb-4">
      <i class="fas fa-sign-in-alt me-2"></i> MASUK KE PORTAL
    </button>
  </form>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbxY35_7Io1cGVVwzwsEn66htauRqvrouHTFm12H8d--MkNA5vNZcVgDuuR9c2fb6X_E2g/exec';

  async function prosesLogin(e) {
    e.preventDefault();
    let btn = document.getElementById('btnLogin');
    let msg = document.getElementById('msg');
    let valUser = document.getElementById('username').value.trim();
    let valPass = document.getElementById('password').value.trim();

    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Menghubungkan...';
    btn.disabled = true;
    msg.innerHTML = '';

    try {
      let res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'login', username: valUser, password: valPass })
      }).then(r => r.json());

      if (res.status === 'success') {
        localStorage.setItem('cbt_user_id', res.user_id);
        localStorage.setItem('cbt_role', res.role);
        localStorage.setItem('cbt_nama', res.nama);
        localStorage.setItem('cbt_kelas', res.kelas || '');
        localStorage.setItem('cbt_mapel', res.mapel || '');

        if (res.role === 'Admin') window.location.href = 'admin.html';
        else if (res.role === 'Guru') window.location.href = 'guru.html';
        else window.location.href = 'ujian.html';
      } else {
        msg.innerHTML = '<i class="fas fa-exclamation-triangle me-1"></i> ' + (res.msg || 'Login gagal!');
      }
    } catch (err) {
      msg.innerHTML = '<i class="fas fa-wifi me-1"></i> Gagal terhubung ke Google Script. Pastikan Web App disetel ke "Anyone".';
    }
    btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i> MASUK KE PORTAL';
    btn.disabled = false;
  }
</script>
</body>
</html>
